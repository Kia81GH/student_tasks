{% extends "assignments/base.html" %}

{% block content %}
    <h2>فهرست درس‌ها</h2>
    
    {% if courses %}
        <ul>
            {% for course in courses %}
                <li>
                    <a href="{% url 'course_detail' course.id %}">{{ course.title }}</a> 
                    - استاد: {{ course.teacher }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>هیچ درسی در سیستم ثبت نشده است.</p>
    {% endif %}
{% endblock %}
